# oh-my-pi — Model and Provider Configuration
# Seeded into ~/.omp/agent/models.yml
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/models.md

providers:
  litellm:
    api: openai-completions
    baseUrl: "http://spark.orca-hue.ts.net:4000/v1"
    apiKey: "anything"
    models:
      - id: "qwen3.8-27b"
        name: "Qwen 3.8 (27B)"
        reasoning: true
        input: [ "text", "image" ]
        contextWindow: 210000
        maxTokens: 16384
        thinking:
          mode: effort
          efforts: [ "low", "medium", "xhigh" ]
          defaultLevel: xhigh
        compat:
          thinkingFormat: "qwen-chat-template"
          qwenTemplateReasoningEffort: true
          supportsReasoningEffort: true
          reasoningEffortMap:
            low: "low"
            medium: "medium"
            xhigh: "xhigh"
          reasoningContentField: "reasoning_content"
          supportsToolChoice: true
          supportsForcedToolChoice: true
          extraBody:
            temperature: 0.7
            top_p: 0.80
            top_k: 20
            presence_penalty: 1.5
            repetition_penalty: 1.0
            chat_template_kwargs:
              enable_thinking: false
              preserve_thinking: true
          whenThinking:
            extraBody:
              temperature: 1.0
              top_p: 0.95
              top_k: 20
              presence_penalty: 0.0
              repetition_penalty: 1.0
              chat_template_kwargs:
                enable_thinking: true
                preserve_thinking: true
      
      - id: "qwen3.6-35b"
        name: "Qwen 3.6 (35B-A3B) Worker"
        reasoning: true
        input: [ "text", "image" ]
        contextWindow: 105000
        maxTokens: 16384
        compat:
          supportsReasoningEffort: false
          thinkingFormat: "qwen-chat-template"
          requiresReasoningContentForToolCalls: false
          reasoningContentField: "reasoning_content"
          extraBody:
            # Non-thinking mode (General) — official recommendation
            temperature: 0.7
            top_p: 0.80
            top_k: 20
            min_p: 0.0
            presence_penalty: 1.5
            repetition_penalty: 1.0
            chat_template_kwargs:
              enable_thinking: false
          whenThinking:
            extraBody:
              # Thinking mode (Coding/precise tasks) — official recommendation
              temperature: 0.6
              top_p: 0.95
              top_k: 20
              min_p: 0.0
              presence_penalty: 0.0
              repetition_penalty: 1.0
              chat_template_kwargs:
                enable_thinking: true
                preserve_thinking: true
      
      
      # --- Qwen3 Coder (4B) Lightweight Model ---
      # Official recommendations (https://huggingface.co/Qwen/Qwen3-4B-Instruct-2507):
      #   Sampling parameters: temp 0.7, top_p 0.80, top_k 20, min_p 0.0, presence_penalty 1.5
      #   Instruct-only (non-thinking model; reasoning effort not supported)
      - id: "qwen3-coder-4b"
        name: "Qwen3 Coder (4B)"
        reasoning: false
        input: ["text", "image"]
        contextWindow: 32768
        maxTokens: 8192
        compat:
          supportsReasoningEffort: false
          extraBody:
            temperature: 0.7
            top_p: 0.80
            top_k: 20
            min_p: 0.0
            presence_penalty: 1.5
            repetition_penalty: 1.0
            chat_template_kwargs:
              enable_thinking: false

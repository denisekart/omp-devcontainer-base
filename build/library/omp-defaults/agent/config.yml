# omp-devcontainer-base default configuration
# Baked at /usr/local/share/omp-defaults/agent/config.yml
# Seeded into ~/.omp/agent/config.yml on first boot (never overwritten on rebuild)

defaultProvider: "litellm"
defaultModel: "litellm/qwen3.8-27b"
defaultSmallModel: "litellm/qwen3-coder-4b"
defaultThinkingLevel: "xhigh"

# LSP Configuration
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/lsp-config.md
lsp:
  servers:
    csharp:
      command: "csharp-ls"
    typescript:
      command: "typescript-language-server"
      args: ["--stdio"]
    svelte:
      command: "svelte-language-server"
      args: ["--stdio"]
    python:
      command: "pylsp"
    bash:
      command: "bash-language-server"
      args: ["start"]

# Memory backend — Hindsight (in-container embedded Postgres, fully local)
# Fallback: change to 'mnemopi' for lightweight SQLite mode
memory:
  backend: hindsight

hindsight:
  apiUrl: "http://localhost:8888"
  scoping: "per-project-tagged"
  autoRecall: true
  autoRetain: true
  recallBudget: "high"
  retainMode: "last-turn"

# Plugin extensions (FULL array — in omp, arrays REPLACE not merge across config levels)
# Global plugins (pi-loop-police, pi-lens, context-mode, pi-simplify) are installed via install-omp-plugins.sh (omp plugin install)
extensions: []

# Plan/draft/spec locations are NOT configurable here: the built-in plan-mode writes
# session-scoped artifacts, and there is no plan-artifact-dir config key in omp.
# Plan files written under .omp/plans/ are a project convention (AGENTS.md). Do not
# re-add a `plan:` block.

# Model Role Mapping
# Assign models defined in models.yml to native omp roles.
#   qwen3.8-27b = primary (agentic reasoning; default/slow/plan)
#   qwen3.6-35b = worker (35B-A3B MoE; delegated subagent tasks) + advisor (binary thinking, on by default)
#   qwen3-coder-4b = smol (background/utility tasks)
modelRoles:
  default: "litellm/qwen3.8-27b"
  smol: "litellm/qwen3-coder-4b"
  slow: "litellm/qwen3.8-27b"
  plan: "litellm/qwen3.8-27b"
  task: "litellm/qwen3.6-35b"     # Worker model: strong coder/specialist given detailed instructions
  memory: "litellm/qwen3-coder-4b" # Used for mnemopi extraction (online fallback)
  tiny: "litellm/qwen3-coder-4b"   # Used for lightweight background tasks (online fallback)
  advisor: "litellm/qwen3.6-35b"       # Passive reviewer; binary thinking, on by default (no effort levels)

# Advisor (passive reviewer)
# A second model reviews the primary transcript as it happens and can inject
# advice (nits / concerns / blockers) into the session. Runs the qwen3.6 worker
# (binary thinking — on by default, no effort levels). OFF by default:
#   per session:    /advisor on          (also: /advisor off | status | dump)
#   single run:     omp -p --advisor "task"
#   persistently:   flip advisor.enabled to true
# Reviewer guidance: add WATCHDOG.md (user agent dir or <dir>/.omp/) for review
# priorities, or WATCHDOG.yml for a named advisor roster.
advisor:
  enabled: false

# Retry / Fallback Chains (retry.fallbackChains)
# Ordered fallback selectors per model. Model-oriented keys apply whenever that
# model is active, regardless of role:
#   - every role running qwen3.8-27b (default/slow/plan) falls back to the
#     qwen3.6-35b worker on provider errors
#   - every role running qwen3-coder-4b (smol/memory/tiny) falls back to the
#     worker too (the most capable selectable local-network model; the true
#     offline path for the small online models is the on-device lfm2-1.2b,
#     wired below via the task-specific providers)
retry:
  fallbackChains:
    "litellm/qwen3.8-27b":
      - "litellm/qwen3.6-35b"
    "litellm/qwen3-coder-4b":
      - "litellm/qwen3.6-35b"

# Local Tiny-Model Providers (Task-specific)
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/local-models.md
# Side tasks (session titles, mnemopi extraction/consolidation, auto-thinking
# difficulty) run on the baked-in local model lfm2-1.2b — the most capable of
# the models pre-downloaded into the image (gemma-270m, lfm2-350m, lfm2-1.2b).
# This makes the small online models (smol/qwen3-coder-4b) effectively fall
# back to the local model: these tasks run fully on-device with no network
# dependency (warm load ~0.4s, fastest of all shipped local models).
# Set any entry back to "online" to route through the role-mapped online model.
providers:
  tinyModel: "lfm2-1.2b"          # e.g., "gemma-270m" or "lfm2-350m" for faster titles
  memoryModel: "lfm2-1.2b"        # recommended local memory model
  autoThinkingModel: "lfm2-1.2b"  # dynamic thinking-difficulty classifier
  tinyModelDevice: "cpu"     # cpu (default), gpu, auto, metal, cuda, dml, wasm
  tinyModelDtype: "q4"       # q4 (default), fp16

# Discovery paths
skills:
  enablePiUser: true
  enablePiProject: true
  customDirectories:
    - "~/.omp/agent/skills"
    - ".omp/skills"

# Subagent Concurrency & Parallelism
# Reference: https://pi.dev/packages/pi-subagents
# Engine limits: qwen3.8-27b serves --max-num-seqs 2 (big-model slots), the
# qwen3.6-35b worker serves --max-num-seqs 6 (small-model slots exceed 6 only
# when many smol/task subagents overlap; the vLLM engine queues the overflow).
subagents:
  globalConcurrencyLimit: 15    # Combined limit (2 big + 18 small sessions)
  maxSubagentDepth: 2           # Prevent unbounded nesting
  forceTopLevelAsync: true      # Background tasks by default
  parallel:
    concurrency: 2              # Max parallel slots for 'big' model tasks (qwen3.8 --max-num-seqs 2)

# Subagent isolation: run each subagent in an isolated copy of the working tree
# (COW clone where the filesystem supports it; 'auto' picks the best available and
# degrades to the shared tree otherwise). Keeps parallel subagents from clobbering
# each other and keeps their churn out of the orchestrator's live tree.
task:
  isolation:
    mode: "auto"

agents:
  customDirectories:
    - "~/.omp/agent/agents"
    - ".omp/agents"

tools:
  format: "native"
# omp-devcontainer-base default configuration
# Baked at /usr/local/share/omp-defaults/agent/config.yml
# Seeded into ~/.omp/agent/config.yml on first boot (never overwritten on rebuild)

# LSP Configuration
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/lsp-config.md
lsp:
  servers:
    csharp:
      command: "csharp-ls"
    typescript:
      command: "typescript-language-server"
      args: ["--stdio"]
    svelte:
      command: "svelte-language-server"
      args: ["--stdio"]
    python:
      command: "pylsp"
    bash:
      command: "bash-language-server"
      args: ["start"]

# Memory backend — Hindsight (in-container embedded Postgres, fully local)
# Fallback: change to 'mnemopi' for lightweight SQLite mode
memory:
  backend: hindsight

hindsight:
  apiUrl: "http://localhost:8888"
  scoping: "per-project-tagged"
  autoRecall: true
  autoRetain: true
  recallBudget: "mid"
  retainMode: "last-turn"

# Plugin extensions (FULL array — in omp, arrays REPLACE not merge across config levels)
# Global plugins (pi-loop-police, pi-lens, context-mode) are installed via install-omp-plugins.sh (omp plugin install)
extensions: []

# Plan workflow artifacts
plan:
  artifactDir: ".omp/plans"
  draftDir: ".omp/drafts"
  specsDir: ".omp/specs"

# Model Role Mapping
# Assign models defined in models.yml to native omp roles.
modelRoles:
  default: "litellm/qwen3.8-27b"
  smol: "litellm/qwen3-coder-4b"
  slow: "litellm/qwen3.8-27b"
  plan: "litellm/qwen3.8-27b"
  task: "litellm/qwen3.8-27b"
  memory: "litellm/qwen3-coder-4b" # Used for mnemopi extraction (online fallback)
  tiny: "litellm/qwen3-coder-4b"   # Used for lightweight background tasks (online fallback)

# Local Tiny-Model Providers (Task-specific)
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/local-models.md
# Set to 'online' to use the role-mapped models, or specify a local tiny model.
# Minimum footprint options:
#   - tinyModel (titles/sub-1B): "gemma-270m" (smallest footprint ~270M) or "lfm2-350m" (balanced ~212MB q4)
#   - memoryModel / autoThinkingModel (1B-1.7B): "lfm2-1.2b" (recommended ~700MB q4) or "qwen2.5-1.5b" / "gemma-3-1b"
# Note: qwen3-1.7b is currently unsupported by onnxruntime-node.
providers:
  tinyModel: "online"        # e.g., "gemma-270m" or "lfm2-350m" for fast titles
  memoryModel: "online"      # e.g., "lfm2-1.2b" for robust extraction/consolidation
  autoThinkingModel: "online" # e.g., "lfm2-1.2b" for auto-thinking difficulty
  tinyModelDevice: "cpu"     # cpu (default), gpu, auto, metal, cuda, dml, wasm
  tinyModelDtype: "q4"       # q4 (default), fp16

# Discovery paths
skills:
  enablePiUser: true
  enablePiProject: true
  customDirectories:
    - "~/.omp/agent/skills"
    - ".omp/skills"

# Subagent Concurrency & Parallelism
# Reference: https://pi.dev/packages/pi-subagents
subagents:
  globalConcurrencyLimit: 20    # Combined limit (4 big + 16 small sessions)
  maxSubagentDepth: 2           # Prevent unbounded nesting
  forceTopLevelAsync: true      # Background tasks by default
  parallel:
    concurrency: 4              # Max parallel slots for 'big' model tasks

agents:
  customDirectories:
    - "~/.omp/agent/agents"
    - ".omp/agents"

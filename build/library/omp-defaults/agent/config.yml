# omp-devcontainer-base default configuration
# Baked at /usr/local/share/omp-defaults/agent/config.yml.
# Model sections (defaultProvider/defaultModel/defaultSmallModel/
# defaultThinkingLevel, modelRoles, retry, providers tiny-models) define the
# WORKSPACE .omp/config.yml that bootstrap seeds — they are never copied into
# ~/.omp/agent/config.yml (seed-omp-home.sh skips them). All other sections
# below seed the user layer and are never overwritten once present.

defaultProvider: "litellm"
defaultModel: "litellm/qwen3.8-27b"
defaultSmallModel: "litellm/qwen3-coder-4b"
defaultThinkingLevel: "medium"

# LSP Configuration
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/lsp-config.md
lsp:
  servers:
    csharp:
      command: "csharp-ls"
    typescript:
      command: "typescript-language-server"
      args: ["--stdio"]
    svelte:
      command: "svelte-language-server"
      args: ["--stdio"]
    python:
      command: "pylsp"
    bash:
      command: "bash-language-server"
      args: ["start"]
    c:
      command: "clangd"
      args: ["--background-index", "--header-insertion=iwyu"]
      fileTypes: [".c", ".cc", ".cpp", ".cxx", ".h", ".hpp", ".hxx", ".cu", ".cuh", ".m", ".mm"]
      rootMarkers: ["compile_commands.json", "CMakeLists.txt", ".clangd", ".clang-format", "Makefile", "west.yml", "Kconfig"]
    dts:
      command: "devicetree-language-server"
      args: ["--stdio"]
      fileTypes: [".dts", ".dtsi", ".overlay"]
      rootMarkers: [".git", "CMakeLists.txt", "west.yml", "Kconfig"]

# Memory backend — Hindsight (in-container embedded Postgres, fully local)
# Fallback: change to 'mnemopi' for lightweight SQLite mode
memory:
  backend: hindsight

hindsight:
  apiUrl: "http://localhost:8888"
  scoping: "per-project-tagged"
  autoRecall: true
  autoRetain: true
  recallBudget: "high"
  retainMode: "last-turn"

# Plugin extensions (FULL array — in omp, arrays REPLACE not merge across config levels)
# Global plugins (pi-loop-police, pi-lens, context-mode, pi-simplify) are installed via install-omp-plugins.sh (omp plugin install)
extensions: []

# Plan/draft/spec locations are NOT configurable here: the built-in plan-mode writes
# session-scoped artifacts, and there is no plan-artifact-dir config key in omp.
# Plan files written under .omp/plans/ are a project convention (AGENTS.md). Do not
# re-add a `plan:` block.

# Model Role Mapping — model roles map to the models defined in the workspace
# .omp/models.yml; omp merges it OVER the user layer (~/.omp/agent/models.yml)
# at startup — the image never seeds the user-layer file (seed-omp-home.sh excludes models.yml).
#   litellm/qwen3.8-27b  primary: agentic reasoning; default/slow/plan; only
#                          model with thinking effort levels (default xhigh)
#   litellm/qwen3.6-35b  worker: 35B-A3B MoE; task + advisor; binary thinking
#                          (on by default, no effort levels); vLLM slot limit 6
#   litellm/qwen3-coder-4b smol: instruction-only 4B; memory/tiny/background;
#                          no reasoning effort
modelRoles:
  default: "litellm/qwen3.8-27b"
  smol: "litellm/qwen3-coder-4b"
  slow: "litellm/qwen3.8-27b"
  plan: "litellm/qwen3.8-27b"
  task: "litellm/qwen3.6-35b"
  memory: "litellm/qwen3-coder-4b"
  tiny: "litellm/qwen3-coder-4b"
  advisor: "litellm/qwen3.6-35b"

# Advisor (passive reviewer): second model (qwen3.6 worker) reviews the
# primary transcript and can inject advice. OFF by default; knobs:
#   per session:    /advisor on          (also: /advisor off | status | dump)
#   single run:     omp -p --advisor "task"
# Reviewer guidance: WATCHDOG.md (user agent dir or <dir>/.omp/) for review
# priorities, WATCHDOG.yml for a named advisor roster.
advisor:
  enabled: false

# Retry / Fallback Chains (retry.fallbackChains — settings key). Applied on
# provider errors; model selector = chain key; every role running the keyed
# model follows the chain. Chains reference catalog models only; the
# on-device lfm2-1.2b offline backstop is NOT a catalog model — it serves
# side tasks via the task-specific tiny-worker providers (providers.tinyModel/
# memoryModel/autoThinkingModel below) and is always available offline. When
# litellm is down the chains end at the last online link (session still
# starts; roles degrade); side tasks keep running on-device.
retry:
  fallbackChains:
    "litellm/qwen3.8-27b":
      - "litellm/qwen3.6-35b"
      - "litellm/qwen3-coder-4b"
    "litellm/qwen3.6-35b":
      - "litellm/qwen3-coder-4b"
    "litellm/qwen3-coder-4b": []

# Local Tiny-Model Providers (Task-specific)
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/local-models.md
# Task-specific local side tasks (session titles, mnemopi
# extraction/consolidation, auto-thinking difficulty) run on the ONNX
# tiny-worker lfm2-1.2b — fully offline, independent of the online models.
# Set any entry to "online" to route through the role model instead.
providers:
  tinyModel: "lfm2-1.2b"          # e.g., "gemma-270m" or "lfm2-350m" for faster titles
  memoryModel: "lfm2-1.2b"        # recommended local memory model
  autoThinkingModel: "lfm2-1.2b"  # dynamic thinking-difficulty classifier
  tinyModelDevice: "cpu"     # cpu (default), gpu, auto, metal, cuda, dml, wasm
  tinyModelDtype: "q4"       # q4 (default), fp16

# Discovery paths
skills:
  enablePiUser: true
  enablePiProject: true
  customDirectories:
    - "~/.omp/agent/skills"
    - ".omp/skills"

# Subagent Concurrency & Parallelism
# Reference: https://pi.dev/packages/pi-subagents
# Engine limits: qwen3.8-27b serves --max-num-seqs 2 (big-model slots), the
# qwen3.6-35b worker serves --max-num-seqs 6 (small-model slots exceed 6 only
# when many smol/task subagents overlap; the vLLM engine queues the overflow).
subagents:
  globalConcurrencyLimit: 15    # Combined limit (2 big + 18 small sessions)
  maxSubagentDepth: 2           # Prevent unbounded nesting
  forceTopLevelAsync: true      # Background tasks by default
  parallel:
    concurrency: 2              # Max parallel slots for 'big' model tasks (qwen3.8 --max-num-seqs 2)

# Subagent isolation: run each subagent in an isolated copy of the working tree
# (COW clone where the filesystem supports it; 'auto' picks the best available and
# degrades to the shared tree otherwise). Keeps parallel subagents from clobbering
# each other and keeps their churn out of the orchestrator's live tree.
task:
  isolation:
    enabled: true
  enableEffort: true
  enableLsp: true

agents:
  customDirectories:
    - "~/.omp/agent/agents"
    - ".omp/agents"

tools:
  format: "native"

# ---------------------------------------------------------------------------
# User defaults (ported 2026-09-07 from the live ~/.omp/agent/config.yml —
# /settings output of this devcontainer). ONLY keys whose value differs from
# omp's built-in default are listed; everything else intentionally stays at
# the built-in default. To change a default for all future instances, edit the
# value here and rebuild the image. Existing instances are unaffected
# (seed-omp-home.sh never overwrites ~/.omp/agent/config.yml).
# ---------------------------------------------------------------------------
steeringMode: all
interruptMode: wait
error:
  notify: "on"
hideThinkingBlock: true
statusLine:
  preset: full
  separator: pipe
  compactThinkingLevel: false
display:
  showTokenUsage: true
  showTurnTime: true
features:
  unexpectedStopDetection: smart
compaction:
  methodOrder:
    - handoff
    - soft
    - shake
    - snapcompact
    - remote
  handoffSaveToDisk: true
autolearn:
  enabled: true
  autoContinue: true
astGrep:
  enabled: true
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
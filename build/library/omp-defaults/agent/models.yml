# oh-my-pi — Model and Provider Configuration
# Seeded into ~/.omp/agent/models.yml
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/models.md

providers:
  litellm:
    api: openai-completions
    baseUrl: "http://spark.orca-hue.ts.net:4000/v1"
    apiKey: "anything"
    models:
      # --- Qwen 3.8 (27B) with Dynamic Thinking & Reasoning Levels ---
      # vLLM backend: --max-model-len 230000 --max-num-seqs 2 --max-num-batched-tokens 32768
      # (2 concurrent sequences — keep subagents.parallel.concurrency at 2)
      - id: "qwen3.8-27b"
        name: "Qwen 3.8 (27B)"
        reasoning: true
        input: ["text", "image"]
        contextWindow: 230000
        maxTokens: 16384
        thinking:
          mode: effort
          minLevel: low
          maxLevel: xhigh
        compat:
          thinkingFormat: "qwen-chat-template"
          qwenTemplateReasoningEffort: true
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: "low"
            low: "low"
            medium: "medium"
            high: "high"
            xhigh: "high"
          requiresReasoningContentForToolCalls: true
          reasoningContentField: "reasoning_content"
          extraBody:
            temperature: 0.7
            top_p: 0.80
            top_k: 20
            min_p: 0.0
            presence_penalty: 1.5
            repetition_penalty: 1.0
            chat_template_kwargs:
              enable_thinking: false
          whenThinking:
            extraBody:
              temperature: 1.0
              top_p: 0.95
              top_k: 20
              min_p: 0.0
              presence_penalty: 0.0
              repetition_penalty: 1.0
              chat_template_kwargs:
                enable_thinking: true

      # --- Qwen 3.6 (35B-A3B) Worker Model (HauhauCS Uncensored, NVFP4) ---
      # Multimodal MoE worker: 35B total / 3B active. Less agentic-reasoning
      # capable than Qwen 3.8, but a very capable coder/specialist given
      # detailed instructions. Mapped to the `task` role (subagent workers).
      # vLLM backend: --max-model-len 100000 --max-num-seqs 6 --max-num-batched-tokens 8192
      #               --quantization compressed-tensors --kv-cache-dtype fp8
      #               --enable-auto-tool-choice --tool-call-parser qwen3_coder
      #               --reasoning-parser qwen3 (thinking + non-thinking modes)
      # Sampling per Qwen3.6 model card:
      #   thinking (precise coding): temp 0.6, top_p 0.95, top_k 20, min_p 0.0,
      #                              presence_penalty 0.0, repetition_penalty 1.0
      #   non-thinking (instruct):   temp 0.7, top_p 0.80, top_k 20, min_p 0.0,
      #                              presence_penalty 1.5, repetition_penalty 1.0
      #   output budget 32768 (card: 32,768 for most queries)
      # preserve_thinking: keeps historical thinking traces in context —
      # recommended by the model card for agent scenarios (better decision
      # consistency, less redundant reasoning, better KV-cache utilization).
      - id: "qwen3.6-35b"
        name: "Qwen 3.6 (35B-A3B) Worker"
        reasoning: true
        input: ["text", "image"]
        contextWindow: 100000
        maxTokens: 32768
        thinking:
          mode: effort
          minLevel: low
          maxLevel: xhigh
        compat:
          thinkingFormat: "qwen-chat-template"
          qwenTemplateReasoningEffort: true
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: "low"
            low: "low"
            medium: "medium"
            high: "high"
            xhigh: "high"
          requiresReasoningContentForToolCalls: true
          reasoningContentField: "reasoning_content"
          extraBody:
            temperature: 0.7
            top_p: 0.80
            top_k: 20
            min_p: 0.0
            presence_penalty: 1.5
            repetition_penalty: 1.0
            chat_template_kwargs:
              enable_thinking: false
          whenThinking:
            extraBody:
              temperature: 0.6
              top_p: 0.95
              top_k: 20
              min_p: 0.0
              presence_penalty: 0.0
              repetition_penalty: 1.0
              chat_template_kwargs:
                enable_thinking: true
                preserve_thinking: true

      # --- Qwen3 Coder (4B) Lightweight Model ---
      - id: "qwen3-coder-4b"
        name: "Qwen3 Coder (4B)"
        reasoning: false
        input: ["text", "image"]
        contextWindow: 48000
        maxTokens: 8192
        compat:
          supportsReasoningEffort: false
          extraBody:
            temperature: 0.7
            top_p: 0.80
            top_k: 20
            min_p: 0.0
            presence_penalty: 1.5
            repetition_penalty: 1.0
            chat_template_kwargs:
              enable_thinking: false


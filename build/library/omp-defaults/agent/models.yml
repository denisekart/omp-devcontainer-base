# oh-my-pi — Model and Provider Configuration
# Seeded into ~/.omp/agent/models.yml
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/models.md

# To use a model:
# 1. Define the provider and model here.
# 2. Map the model to a role (smol, slow, plan, etc.) in ~/.omp/agent/config.yml.

providers:
  local:
    api: openai-completions
    baseUrl: "http://host.docker.internal:11434/v1"
    apiKey: "none"
    auth: none
    models:
      qwen2.5-coder:7b:
        id: "qwen2.5-coder:7b"
      deepseek-r1:32b:
        id: "deepseek-r1:32b"

  # Example: Remote OpenAI
  # openai:
  #   api: openai-completions
  #   apiKey: "sk-..."
  #   models:
  #     gpt-4o:
  #       id: "gpt-4o"

  # Example: Remote Anthropic
  # anthropic:
  #   api: anthropic-messages
  #   apiKey: "sk-ant-..."

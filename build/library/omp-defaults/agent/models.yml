# oh-my-pi — Model and Provider Configuration
# Seeded into ~/.omp/agent/models.yml
# Reference: https://github.com/can1357/oh-my-pi/blob/main/docs/models.md

providers:
  litellm:
    api: openai-completions
    baseUrl: "http://spark.orca-hue.ts.net:4000/v1"
    apiKey: "anything"
    models:
      # --- Qwen 3.8 (27B) with Dynamic Thinking & Reasoning Levels ---
      - id: "qwen3.8-27b"
        name: "Qwen 3.8 (27B)"
        reasoning: true
        input: ["text"]
        contextWindow: 131072
        maxTokens: 16384
        thinking:
          mode: effort
          minLevel: low
          maxLevel: xhigh
        compat:
          thinkingFormat: "qwen-chat-template"
          qwenTemplateReasoningEffort: true
          supportsReasoningEffort: true
          reasoningEffortMap:
            minimal: "low"
            low: "low"
            medium: "medium"
            high: "high"
            xhigh: "high"
          requiresReasoningContentForToolCalls: true
          reasoningContentField: "reasoning_content"
          extraBody:
            chat_template_kwargs:
              enable_thinking: true

      # --- Qwen3 Coder (4B) Lightweight Model ---
      - id: "qwen3-coder-4b"
        name: "Qwen3 Coder (4B)"
        reasoning: false
        input: ["text"]
        contextWindow: 32768
        maxTokens: 8192
        compat:
          supportsReasoningEffort: false
          extraBody:
            chat_template_kwargs:
              enable_thinking: false

  # Optional local fallback provider via Ollama/vLLM

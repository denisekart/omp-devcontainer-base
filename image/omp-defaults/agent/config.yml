# omp-devcontainer-base default configuration
# Baked at /usr/local/share/omp-defaults/agent/config.yml
# Seeded into ~/.omp/agent/config.yml on first boot (never overwritten on rebuild)

# Memory backend — Hindsight (in-container embedded Postgres, fully local)
# Fallback: change to 'mnemopi' for lightweight SQLite mode
memory:
  backend: hindsight

hindsight:
  apiUrl: "http://localhost:8888"
  scoping: "per-project-tagged"
  autoRecall: true
  autoRetain: true
  recallBudget: "mid"
  retainMode: "last-turn"

# Plugin extensions (FULL array — in omp, arrays REPLACE not merge across config levels)
# This exact list must be consistent with install-omp-plugins.sh and docs/plugins.md
extensions:
  - "pi-atelier"
  - "pi-loop-police"
  - "pi-lens"
  - "context-mode"
  - "@narumitw/pi-btw"

# TUI theme — pi-atelier provides the status rail and activity sidebar
theme:
  name: "pi-atelier"

# Plan workflow artifacts
plan:
  artifactDir: ".omo/plans"
  draftDir: ".omo/drafts"
  specsDir: ".omo/specs"

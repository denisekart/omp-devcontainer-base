# omp-devcontainer-base — local model endpoint configuration
#
# SWAP PROCEDURE (no other files need changing):
#   1. Edit the 3 __FILL_*__ placeholders per alias below
#   2. Save this file
#   3. Restart omp (close and reopen)
#
# __FILL_*__ placeholder guide:
#   __FILL_NEMOTRON_PORT__     → port your nemotron-super-120b server listens on (e.g. 11434)
#   __FILL_NEMOTRON_MODEL_ID__ → model ID your server expects (e.g. "nemotron-super-12b")
#   __FILL_QWEN_PORT__         → port your qwen-4b-instruct server listens on (e.g. 11435)
#   __FILL_QWEN_MODEL_ID__     → model ID your server expects (e.g. "qwen2.5-coder:4b")
#   __FILL_API_KEY_OR_NONE__   → API key if required, or "none" for unauthenticated local servers
#
# host.docker.internal resolves to the host machine from inside the container.

models:
  nemotron-super-120b:
    transport: openai-completions
    baseUrl: "http://host.docker.internal:__FILL_NEMOTRON_PORT__/v1"
    apiKey: "__FILL_API_KEY_OR_NONE__"
    model: "__FILL_NEMOTRON_MODEL_ID__"
    concurrency: 4

  qwen-4b-instruct:
    transport: openai-completions
    baseUrl: "http://host.docker.internal:__FILL_QWEN_PORT__/v1"
    apiKey: "__FILL_API_KEY_OR_NONE__"
    model: "__FILL_QWEN_MODEL_ID__"
    concurrency: 16
